version: 2
jobs:
  build:
    macos:
      xcode: '14.3.1'
    resource_class: m4pro.medium
    steps:
      - checkout
      - run:
          name: Use Node.js 16
          command: |
            nvm install 16
            nvm alias default 16
            {
              echo 'export NVM_DIR="$HOME/.nvm"'
              echo '[ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"'
              echo 'nvm use 16 >/dev/null'
            } >> "$BASH_ENV"
            nvm use 16
            npm install --global yarn@1.22.19
            node --version
            yarn --version
      - run:
          name: Install native build tools
          command: |
            export HOMEBREW_NO_AUTO_UPDATE=1
            export HOMEBREW_NO_INSTALL_CLEANUP=1
            brew install automake libtool pkg-config || true
            echo 'export PATH="/opt/homebrew/opt/libtool/libexec/gnubin:$PATH"' >> "$BASH_ENV"
            export PATH="/opt/homebrew/opt/libtool/libexec/gnubin:$PATH"
            command -v aclocal
      - run: yarn
      - run: mkdir -p ~/reports
      - run: yarn lint
      - run: yarn test:ci
      - run: yarn run dist
      - run: mv dist/*-x64.dmg dist/Kap-x64.dmg
      - run: mv dist/*-arm64.dmg dist/Kap-arm64.dmg
      - store_artifacts:
          path: dist/Kap-x64.dmg
      - store_artifacts:
          path: dist/Kap-arm64.dmg
      - store_test_results:
          path: ~/reports
  sentry-release:
    docker:
      - image: cimg/node:lts
    environment:
      SENTRY_ORG: wulkano-l0
      SENTRY_PROJECT: kap
    steps:
      - checkout
      - run: |
          curl -sL https://sentry.io/get-cli/ | bash
          export SENTRY_RELEASE=$(yarn run -s sentry-version)
          sentry-cli releases new -p $SENTRY_PROJECT $SENTRY_RELEASE
          sentry-cli releases set-commits --auto $SENTRY_RELEASE
          sentry-cli releases finalize $SENTRY_RELEASE

workflows:
  version: 2
  build:
    jobs:
      - build:
          filters:
            tags:
              only: /.*/ # Force CircleCI to build on tags
      - sentry-release:
          requires:
            - build
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
