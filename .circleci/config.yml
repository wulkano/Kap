version: 2
jobs:
  build:
    macos:
      xcode: '14.3.1'
    resource_class: m4pro.medium
    steps:
      - checkout
      - run:
          name: Use Node 16
          command: |
            nvm install 16.20.2
            nvm alias default 16.20.2
            echo 'export PATH="$HOME/.nvm/versions/node/v16.20.2/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Install native build tools
          command: brew install automake
      - run: yarn
      - run: mkdir -p ~/reports
      - run: yarn lint
      - run: yarn test:ci
      - run: yarn run dist
      - run: mv dist/*-x64.dmg dist/Kap-x64.dmg
      - run: mv dist/*-arm64.dmg dist/Kap-arm64.dmg
      - store_artifacts:
          path: dist/Kap-x64.dmg
      - store_artifacts:
          path: dist/Kap-arm64.dmg
      - store_test_results:
          path: ~/reports
  sentry-release:
    docker:
      - image: cimg/node:lts
    environment:
      SENTRY_ORG: wulkano-l0
      SENTRY_PROJECT: kap
    steps:
      - checkout
      - run: |
          curl -sL https://sentry.io/get-cli/ | bash
          export SENTRY_RELEASE=$(yarn run -s sentry-version)
          sentry-cli releases new -p $SENTRY_PROJECT $SENTRY_RELEASE
          sentry-cli releases set-commits --auto $SENTRY_RELEASE
          sentry-cli releases finalize $SENTRY_RELEASE

workflows:
  version: 2
  build:
    jobs:
      - build:
          filters:
            tags:
              only: /.*/ # Force CircleCI to build on tags
      - sentry-release:
          requires:
            - build
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
